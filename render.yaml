# Render blueprint for the AgentGuard API (render.com -> New -> Blueprint -> this repo).
# The dashboard goes on Vercel; see docs/DEPLOY.md.
services:
  - type: web
    name: agentguard-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # No Ollama on Render: rule pre-check, anything unclear goes to a human.
      - key: AGENTGUARD_JUDGE
        value: rules
      - key: SESSION_SECRET
        generateValue: true
      # Public read-only demo page (/demo). This deployment only holds demo data.
      - key: AGENTGUARD_PUBLIC_DEMO
        value: "1"
      # Fill these in the Render dashboard (never commit them):
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_ORGANIZATION_ID
        sync: false
      - key: AGENTGUARD_USER_EMAILS
        sync: false
      # Where the dashboard lives (not secret). Change both to your own Vercel URL if you fork this.
      - key: WORKOS_REDIRECT_URI
        value: https://agentguard-liard.vercel.app/api/auth/callback
      - key: DASHBOARD_URL
        value: https://agentguard-liard.vercel.app
